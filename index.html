<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Microbe in Space</title>
    <link
      rel="icon"
      href="assets/microbe_gifs/bac1_1.gif"
      type="image/gif"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: #000;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: url("assets/background.png") center / cover no-repeat;
        opacity: 0.7;
        z-index: -1;
      }

      #webcam {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
        opacity: 0.18;
        filter: grayscale(1);
        z-index: 0;
        pointer-events: none;
        display: none;
      }

      #webcam.active {
        display: block;
      }

      #hands-debug {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 2000;
        pointer-events: none;
      }

      #camera-status {
        position: fixed;
        bottom: 72px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.7);
        font: 14px/1.4 sans-serif;
        z-index: 1001;
        pointer-events: none;
        text-align: center;
        max-width: 80%;
      }

      .hand-cursor {
        position: fixed;
        width: 18px;
        height: 18px;
        margin: -9px 0 0 -9px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.35);
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
        pointer-events: none;
        z-index: 900;
        display: none;
        left: 0;
        top: 0;
      }

      .hand-cursor.visible {
        display: block;
      }

      .hand-cursor.pinched {
        background: rgba(255, 255, 255, 0.75);
        box-shadow: 0 0 16px rgba(255, 255, 255, 0.9);
        transform: scale(0.7);
      }

      #main-content {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }

      #main-content > * {
        pointer-events: auto;
      }

      .pixelated-circle {
        width: 800px;
        height: 800px;
        border-radius: 42% 58% 33% 67% / 55% 38% 62% 45%;
        position: relative;
        flex-shrink: 0;
        pointer-events: none;
        background: radial-gradient(
          circle at 30% 30%,
          rgba(255, 255, 255, 0.4) 0%,
          rgba(255, 255, 255, 0.1) 30%,
          rgba(200, 200, 200, 0.2) 50%,
          rgba(180, 180, 180, 0.15) 70%,
          rgba(120, 120, 120, 0.1) 100%
        );

        box-shadow:
          0 0 40px rgba(160, 160, 160, 0.3),
          inset 0 0 60px rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }

      #inner-dots {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        pointer-events: none;
      }

      .corner-container {
        position: fixed;
        width: 300px;
        height: 300px;
        z-index: 5;
        pointer-events: none;
      }

      .corner-container > * {
        pointer-events: auto;
      }

      .top-left {
        top: -20px;
        left: -20px;
      }
      .top-right {
        top: -20px;
        right: -20px;
      }
      .bottom-left {
        bottom: -20px;
        left: -20px;
      }
      .bottom-right {
        bottom: -20px;
        right: -20px;
      }
      .left-margin {
        top: 50%;
        left: -20px;
        transform: translateY(-20%);
      }
      .right-margin {
        top: 50%;
        right: -20px;
        transform: translateY(-50%);
      }

      .corner-microbe,
      .inner-microbe {
        position: absolute;
        width: 80px;
        left: 0;
        top: 0;
        will-change: transform, opacity;
      }

      .corner-microbe {
        width: 120px;
        height: auto;
        cursor: grab;
        user-select: none;
        touch-action: none;
        transform-origin: center center;
      }

      .corner-microbe img,
      .inner-microbe img {
        display: block;
        width: 100%;
        height: auto;
        pointer-events: none;
      }

      .corner-microbe:active {
        cursor: grabbing;
      }

      .corner-microbe.dragging {
        z-index: 1000;
        pointer-events: auto;
      }

      .inner-microbe {
        position: absolute;
        width: 104px;
        margin-left: -52px;
        margin-top: -52px;
        pointer-events: none;
        cursor: default;
        transform-origin: center center;
      }

      #ethanol-button {
        position: fixed;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: 80px;
        height: 100px;
        border: none;
        background: transparent;
        background-image: url("assets/ethanol.webp");
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        cursor: pointer;
        z-index: 1000;
        pointer-events: auto;
        display: none;
        opacity: 0;
        transition: opacity 0.5s ease;
        filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.8))
          drop-shadow(0 0 16px rgba(255, 255, 255, 0.922));
      }

      #ethanol-button.show {
        display: block;
        opacity: 1;
      }

      #ethanol-button:hover {
        filter: drop-shadow(0 0 12px rgba(255, 255, 255, 1))
          drop-shadow(0 0 24px rgba(255, 255, 255, 0.8));
        transform: translateX(-50%) scale(1.1);
        transition:
          filter 0.3s ease,
          transform 0.3s ease;
      }

      #loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: opacity 0.8s ease;
      }

      #loader::before {
        content: "";
        position: absolute;
        inset: 0;
        background: url("assets/background.png") center / cover no-repeat;
        opacity: 0.2;
      }

      #loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      #loader .loader-gif {
        width: 400px;
        animation: loader-pulse 2s ease-in-out infinite;
      }

      #loader .loader-gif img {
        display: block;
        width: 100%;
        height: auto;
      }

      @keyframes loader-pulse {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
    </style>
  </head>
  <body>
    <video id="webcam" playsinline autoplay muted style="transform: rotate(180deg);"></video>
    <canvas id="hands-debug"></canvas>
    <div class="hand-cursor" data-hand="Left"></div>
    <div class="hand-cursor" data-hand="Right"></div>
    <div id="camera-status"></div>

    <div id="loader">
      <div class="loader-gif">
        <img src="assets/loader.gif" alt="Loading…" />
      </div>
    </div>

    <div id="main-content">
      <div class="pixelated-circle">
        <div id="inner-dots"></div>
      </div>
    </div>

    <div
      class="corner-container top-left"
      data-type="bac1"
      id="corner-tl"
    ></div>
    <div
      class="corner-container top-right"
      data-type="bac2"
      id="corner-tr"
    ></div>
    <div
      class="corner-container bottom-left"
      data-type="bac3"
      id="corner-bl"
    ></div>
    <div
      class="corner-container bottom-right"
      data-type="bac4"
      id="corner-br"
    ></div>
    <div
      class="corner-container left-margin"
      data-type="bac5"
      id="corner-lm"
    ></div>
    <div
      class="corner-container right-margin"
      data-type="bac1"
      id="corner-rm"
    ></div>

    <button id="ethanol-button" aria-label="Ethanol - revert everything"></button>

    <script>
      (function () {
        const circle = document.querySelector(".pixelated-circle");
        const rb = () => 40 + Math.random() * 20;
        circle.style.borderRadius =
          `${rb()}% ${rb()}% ${rb()}% ${rb()}% / ${rb()}% ${rb()}% ${rb()}% ${rb()}%`;
        const innerDotsContainer = document.getElementById("inner-dots");

        const MICROBE_VARIANTS = {
          bac1: ["bac1_1", "bac1_2", "bac1_3", "bac1_4"],
          bac2: ["bac2_1", "bac2_2", "bac2_3", "bac2_4", "bac2_5"],
          bac3: ["bac3_1", "bac3_2", "bac3_3", "bac3_4"],
          bac4: ["bac4_1", "bac4_2", "bac4_3", "bac4_4", "bac4_5"],
          bac5: ["bac5_1", "bac5_2", "bac5_3", "bac5_4", "bac5_5"],
        };

        var CORNER_ID_TO_TRACK = {
          "corner-tl": 1,
          "corner-tr": 2,
          "corner-bl": 3,
          "corner-br": 4,
          "corner-lm": 5,
          "corner-rm": 6,
        };

        function getFiveGifsForType(type) {
          const variants = MICROBE_VARIANTS[type] || MICROBE_VARIANTS.bac1;
          const five = variants.slice(0, 5);
          while (five.length < 5)
            five.push(variants[five.length % variants.length]);
          return five;
        }

        function getCornerGifSrcs(type) {
          const variants = MICROBE_VARIANTS[type] || MICROBE_VARIANTS.bac1;
          const base = "assets/microbe_gifs/";
          return variants.map(function (name) {
            return base + name + ".gif";
          });
        }

        function microbeSrc(el) {
          if (!el) return "";
          if (el.tagName === "IMG") return el.src;
          var img = el.querySelector("img");
          return img ? img.src : "";
        }

        function createMicrobe(className, src) {
          var wrap = document.createElement("div");
          wrap.className = className;
          var img = document.createElement("img");
          img.src = src;
          img.draggable = false;
          img.alt = "";
          img.decoding = "async";
          wrap.appendChild(img);
          return wrap;
        }

        function randomGifForType(type) {
          const variants = MICROBE_VARIANTS[type] || MICROBE_VARIANTS.bac1;
          const name = variants[Math.floor(Math.random() * variants.length)];
          return "assets/microbe_gifs/" + name + ".gif";
        }

        const microbeMovement = new WeakMap();
        const cornerMicrobes = [];
        const innerMicrobes = [];
        const grabs = new Map();

        function removeFromList(list, el) {
          var i = list.indexOf(el);
          if (i >= 0) list.splice(i, 1);
        }

        function getCircleBounds() {
          const rect = circle.getBoundingClientRect();
          return {
            centerX: rect.left + rect.width / 2,
            centerY: rect.top + rect.height / 2,
            radius: rect.width / 2,
          };
        }

        function isPointInCircle(x, y) {
          const bounds = getCircleBounds();
          const dist = Math.sqrt(
            Math.pow(x - bounds.centerX, 2) + Math.pow(y - bounds.centerY, 2)
          );
          return dist <= bounds.radius - 20;
        }

        function initCornerMovement(img, fadeIn) {
          const container = img.parentElement;
          const isLeft =
            container.classList.contains("top-left") ||
            container.classList.contains("bottom-left") ||
            container.classList.contains("left-margin");
          const isLeftMargin = container.classList.contains("left-margin");

          const data = {
            x: Math.random() * 180,
            y: isLeftMargin ? (Math.random() - 0.5) * 260 : Math.random() * 180,
            vx: (Math.random() - 0.5) * 0.4,
            vy: (Math.random() - 0.5) * 0.4,
            targetX: Math.random() * 260,
            targetY: isLeftMargin
              ? (Math.random() - 0.5) * 260
              : Math.random() * 260,
            opacity: fadeIn ? 0 : 0.5 + Math.random() * 0.5,
            opacityDir: Math.random() > 0.5 ? 1 : -1,
            speed: 0.06 + Math.random() * 0.14,
            bounds: isLeftMargin
              ? { minX: -20, maxX: 280, minY: -130, maxY: 130 }
              : { minX: -20, maxX: 280, minY: -20, maxY: 280 },
            rotation: (Math.random() - 0.5) * 0.004,
            angle: Math.random() * Math.PI * 2,
            fadeIn: !!fadeIn,
          };
          microbeMovement.set(img, data);
          updateCornerMicrobePosition(img);
        }

        function updateCornerMicrobePosition(img, dt) {
          const data = microbeMovement.get(img);
          if (!data || img.classList.contains("dragging")) return;
          if (dt == null || dt <= 0) dt = 1;

          const dx = data.targetX - data.x;
          const dy = data.targetY - data.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 5) {
            data.targetX =
              data.bounds.minX +
              Math.random() * (data.bounds.maxX - data.bounds.minX);
            data.targetY =
              data.bounds.minY +
              Math.random() * (data.bounds.maxY - data.bounds.minY);
            data.speed = 0.06 + Math.random() * 0.14;
          }

          if (dist > 0) {
            data.vx += (dx / dist) * 0.02 * data.speed * dt;
            data.vy += (dy / dist) * 0.02 * data.speed * dt;
          }
          data.vx += (Math.random() - 0.5) * 0.04 * dt;
          data.vy += (Math.random() - 0.5) * 0.04 * dt;
          data.vx *= Math.pow(0.98, dt);
          data.vy *= Math.pow(0.98, dt);
          data.x += data.vx * dt;
          data.y += data.vy * dt;

          data.x = Math.max(
            data.bounds.minX,
            Math.min(data.bounds.maxX, data.x)
          );
          data.y = Math.max(
            data.bounds.minY,
            Math.min(data.bounds.maxY, data.y)
          );
          if (data.x <= data.bounds.minX || data.x >= data.bounds.maxX)
            data.vx *= -0.5;
          if (data.y <= data.bounds.minY || data.y >= data.bounds.maxY)
            data.vy *= -0.5;

          if (data.fadeIn) {
            data.opacity = Math.min(data.opacity + 0.015 * dt, 0.7);
            if (data.opacity >= 0.7) {
              data.fadeIn = false;
              data.opacityDir = 1;
            }
          } else {
            data.opacity += data.opacityDir * 0.0025 * dt;
            if (data.opacity > 1) {
              data.opacity = 1;
              data.opacityDir = -1;
            }
            if (data.opacity < 0.4) {
              data.opacity = 0.4;
              data.opacityDir = 1;
            }
          }

          data.angle += data.rotation * dt;
          var deg = ((data.angle * 180) / Math.PI) % 360;
          img.style.transform =
            "translate3d(" +
            data.x +
            "px, " +
            data.y +
            "px, 0) rotate(" +
            deg +
            "deg)";
          img.style.opacity = data.opacity;
        }

        function initInnerMovement(img, startX, startY) {
          const maxRadius = 350;
          const data = {
            x: startX,
            y: startY,
            vx: (Math.random() - 0.5) * 0.6,
            vy: (Math.random() - 0.5) * 0.6,
            targetX: (Math.random() - 0.5) * maxRadius * 1.5,
            targetY: (Math.random() - 0.5) * maxRadius * 1.5,
            opacity: 0,
            opacityDir: 1,
            speed: 0.1 + Math.random() * 0.2,
            maxRadius: maxRadius,
            rotation: (Math.random() - 0.5) * 0.004,
            angle: Math.random() * Math.PI * 2,
            fadeIn: true,
          };
          microbeMovement.set(img, data);
          updateInnerMicrobePosition(img);
        }

        function updateInnerMicrobePosition(img, dt) {
          const data = microbeMovement.get(img);
          if (!data || img.classList.contains("dragging")) return;
          if (dt == null || dt <= 0) dt = 1;

          const dx = data.targetX - data.x;
          const dy = data.targetY - data.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 10) {
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.random() * data.maxRadius;
            data.targetX = Math.cos(angle) * radius;
            data.targetY = Math.sin(angle) * radius;
            data.speed = 0.1 + Math.random() * 0.2;
          }

          if (dist > 0) {
            data.vx += (dx / dist) * 0.03 * data.speed * dt;
            data.vy += (dy / dist) * 0.03 * data.speed * dt;
          }
          data.vx += (Math.random() - 0.5) * 0.06 * dt;
          data.vy += (Math.random() - 0.5) * 0.06 * dt;
          data.vx *= Math.pow(0.985, dt);
          data.vy *= Math.pow(0.985, dt);
          data.x += data.vx * dt;
          data.y += data.vy * dt;

          const currentDist = Math.sqrt(data.x * data.x + data.y * data.y);
          if (currentDist > data.maxRadius) {
            const scale = data.maxRadius / currentDist;
            data.x *= scale;
            data.y *= scale;
            data.vx *= -0.3;
            data.vy *= -0.3;
          }

          if (data.fadeIn) {
            data.opacity = Math.min(data.opacity + 0.02 * dt, 0.5);
            if (data.opacity >= 0.5) {
              data.fadeIn = false;
              data.opacityDir = Math.random() > 0.5 ? 1 : -1;
            }
          } else {
            data.opacity += data.opacityDir * 0.004 * dt;
            if (data.opacity > 1) {
              data.opacity = 1;
              data.opacityDir = -1;
            }
            if (data.opacity < 0.4) {
              data.opacity = 0.4;
              data.opacityDir = 1;
            }
          }

          data.angle += data.rotation * dt;
          var deg = ((data.angle * 180) / Math.PI) % 360;
          img.style.transform =
            "translate3d(" +
            data.x +
            "px, " +
            data.y +
            "px, 0) rotate(" +
            deg +
            "deg)";
          img.style.opacity = data.opacity;
        }

        function createInnerMicrobe(
          src,
          offsetX,
          offsetY,
          trackIndex,
          insertBeforeNode
        ) {
          const wrap = createMicrobe("inner-microbe", src);
          if (trackIndex != null) wrap.dataset.trackIndex = String(trackIndex);

          if (insertBeforeNode) {
            innerDotsContainer.insertBefore(wrap, insertBeforeNode);
          } else {
            innerDotsContainer.appendChild(wrap);
          }
          innerMicrobes.push(wrap);
          initInnerMovement(wrap, offsetX, offsetY);
          return wrap;
        }

        function moveToInnerCircle(microbe, dropX, dropY) {
          const src = microbeSrc(microbe);
          const bounds = getCircleBounds();
          const relX = dropX - bounds.centerX;
          const relY = dropY - bounds.centerY;
          var trackIndex = null;
          var container = microbe.parentElement;
          if (
            container &&
            container.id &&
            CORNER_ID_TO_TRACK[container.id] != null
          ) {
            trackIndex = CORNER_ID_TO_TRACK[container.id];
          }
          removeFromList(cornerMicrobes, microbe);
          microbe.remove();
          microbeMovement.delete(microbe);
          var ref = innerDotsContainer.firstChild;
          createInnerMicrobe(src, relX, relY, trackIndex, ref);
        }

        function getVariantNameFromSrc(src) {
          const filename = src.split("/").pop() || "";
          return filename.replace(/\.gif$/i, "");
        }

        function getTypeFromVariant(variantName) {
          const lastUnderscore = variantName.lastIndexOf("_");
          return lastUnderscore >= 0
            ? variantName.substring(0, lastUnderscore)
            : variantName;
        }

        function otherVariantSrcForMicrobe(src) {
          const base = "assets/microbe_gifs/";
          const variantName = getVariantNameFromSrc(src);
          const type = getTypeFromVariant(variantName);
          const variants = MICROBE_VARIANTS[type] || MICROBE_VARIANTS.bac1;
          const others = variants.filter(function (v) {
            return v !== variantName;
          });
          const chosen =
            others.length > 0
              ? others[Math.floor(Math.random() * others.length)]
              : variantName;
          return base + chosen + ".gif";
        }

        function duplicateInnerMicrobe(original) {
          const newSrc = otherVariantSrcForMicrobe(microbeSrc(original));
          const data = microbeMovement.get(original);
          var trackIndex =
            original.dataset.trackIndex != null
              ? parseInt(original.dataset.trackIndex, 10)
              : 1;
          var spawnX = 0,
            spawnY = 0;
          if (data) {
            const angle = Math.random() * Math.PI * 2;
            const r = 20 + Math.random() * 30;
            spawnX = data.x + Math.cos(angle) * r;
            spawnY = data.y + Math.sin(angle) * r;
          }
          createInnerMicrobe(newSrc, spawnX, spawnY, trackIndex, original);
        }

        function applyDragPosition(el, clientX, clientY) {
          if (!el) return;
          var ox = parseFloat(el.dataset.offsetX) || 0;
          var oy = parseFloat(el.dataset.offsetY) || 0;
          var container = el.parentElement;
          if (!container) return;
          var cRect = container.getBoundingClientRect();
          var isInner = el.classList.contains("inner-microbe");
          if (isInner) {
            var left = clientX - ox - cRect.left;
            var top = clientY - oy - cRect.top;
            el.style.transform =
              "translate3d(" + left + "px, " + top + "px, 0) scale(1.2)";
            el.dataset.dragX = left;
            el.dataset.dragY = top;
          } else {
            var tx = clientX - ox - cRect.left;
            var ty = clientY - oy - cRect.top;
            el.style.transform =
              "translate3d(" + tx + "px, " + ty + "px, 0) scale(1.2)";
            el.dataset.dragX = tx;
            el.dataset.dragY = ty;
          }
        }

        function startGrab(id, el, clientX, clientY) {
          if (!el || !el.isConnected) return false;
          if (el.classList.contains("inner-microbe")) return false;
          var heldByOther = false;
          grabs.forEach(function (held, hid) {
            if (held === el && hid !== id) heldByOther = true;
          });
          if (heldByOther) return false;
          if (grabs.has(id) && grabs.get(id) !== el) return false;
          el.classList.add("dragging");
          var rect = el.getBoundingClientRect();
          el.dataset.offsetX = (clientX - rect.left).toString();
          el.dataset.offsetY = (clientY - rect.top).toString();
          grabs.set(id, el);
          applyDragPosition(el, clientX, clientY);
          return true;
        }

        function moveGrab(id, clientX, clientY) {
          var el = grabs.get(id);
          if (!el || !el.isConnected) {
            if (el) grabs.delete(id);
            return;
          }
          applyDragPosition(el, clientX, clientY);
        }

        function endGrab(id) {
          var el = grabs.get(id);
          if (!el) return;
          grabs.delete(id);
          if (!el.isConnected) return;
          var rect = el.getBoundingClientRect();
          var cx = rect.left + rect.width / 2;
          var cy = rect.top + rect.height / 2;
          var wasInner = el.classList.contains("inner-microbe");
          var inCircle = isPointInCircle(cx, cy);

          el.classList.remove("dragging");

          if (wasInner) {
            // Bubble microbes are never interactive; ignore leftover grabs.
            return;
          }

          if (inCircle) {
            moveToInnerCircle(el, cx, cy);
          } else {
            var data = microbeMovement.get(el);
            if (data) {
              var dragX = parseFloat(el.dataset.dragX);
              var dragY = parseFloat(el.dataset.dragY);
              if (!isNaN(dragX)) data.x = dragX;
              if (!isNaN(dragY)) data.y = dragY;
              data.vx = 0;
              data.vy = 0;
              var deg =
                data.angle != null ? ((data.angle * 180) / Math.PI) % 360 : 0;
              el.style.transform =
                "translate3d(" +
                data.x +
                "px, " +
                data.y +
                "px, 0) rotate(" +
                deg +
                "deg)";
              el.style.opacity = data.opacity;
            } else {
              el.style.transform = "";
            }
          }
        }

        function hitTestMicrobe(x, y) {
          // No new grabs while the hand is inside the bubble.
          if (isPointInCircle(x, y)) return null;
          var HIT_RADIUS = 80;
          var best = null;
          var bestDist = HIT_RADIUS;
          for (var i = 0; i < cornerMicrobes.length; i++) {
            var el = cornerMicrobes[i];
            if (el.classList.contains("dragging")) continue;
            var r = el.getBoundingClientRect();
            var cx = r.left + r.width / 2;
            var cy = r.top + r.height / 2;
            var d = Math.sqrt((x - cx) * (x - cx) + (y - cy) * (y - cy));
            if (d < bestDist) {
              bestDist = d;
              best = el;
            }
          }
          return best;
        }

        window.synthPointer = {
          startGrab: startGrab,
          moveGrab: moveGrab,
          endGrab: endGrab,
          hitTestMicrobe: hitTestMicrobe,
          isGrabbing: function (id) {
            return grabs.has(id);
          },
        };

        function onMouseDown(e) {
          e.preventDefault();
          e.stopPropagation();
          startGrab("pointer", e.currentTarget, e.clientX, e.clientY);
        }

        function onTouchStart(e) {
          e.preventDefault();
          e.stopPropagation();
          var clientX = e.touches[0].clientX;
          var clientY = e.touches[0].clientY;
          startGrab("pointer", e.currentTarget, clientX, clientY);
        }

        function onMouseMove(e) {
          if (!grabs.has("pointer")) return;
          e.preventDefault();
          moveGrab("pointer", e.clientX, e.clientY);
        }

        function onTouchMove(e) {
          if (!grabs.has("pointer")) return;
          e.preventDefault();
          moveGrab("pointer", e.touches[0].clientX, e.touches[0].clientY);
        }

        function onPointerEnd() {
          endGrab("pointer");
        }

        var lastAnimate = performance.now();

        function animate(now) {
          if (now == null) now = performance.now();
          var dt = (now - lastAnimate) / 16.6667;
          lastAnimate = now;
          if (dt > 3) dt = 3;
          if (!(dt > 0)) dt = 1;
          for (var i = 0; i < cornerMicrobes.length; i++) {
            updateCornerMicrobePosition(cornerMicrobes[i], dt);
          }
          for (var j = 0; j < innerMicrobes.length; j++) {
            updateInnerMicrobePosition(innerMicrobes[j], dt);
          }
          updateTrackVolumes();
          requestAnimationFrame(animate);
        }

        // ================== audio player (same logic as index.html) ==================
        const audioPlayers = [];
        const trackCount = 7;
        var audioReady = false;
        var isPlaying = false;
        var endedCount = 0;

        function ensureAudio() {
          if (audioReady) return;
          audioReady = true;
          for (var i = 1; i <= trackCount; i++) {
            var audio = new Audio("assets/music/" + i + "track.mp3");
            audio.playbackRate = 0.75;
            audioPlayers.push(audio);
          }
          audioPlayers[0].loop = true;
          audioPlayers.forEach(function (audio, idx) {
            if (idx === 0) return;
            audio.addEventListener("ended", function () {
              endedCount++;
              if (endedCount === 6) {
                isPlaying = false;
                endedCount = 0;
              }
            });
          });
        }

        function playAllTracks() {
          ensureAudio();
          audioPlayers[0].volume = 0.5;
          for (var i = 1; i < audioPlayers.length; i++) {
            audioPlayers[i].volume = 0.0;
          }
          endedCount = 0;
          audioPlayers.forEach(function (audio) {
            audio.play().catch(function (err) {
              console.error("Error playing audio:", err);
            });
          });
          isPlaying = true;
        }

        function emptyBubble() {
          var toRelease = [];
          grabs.forEach(function (el, id) {
            if (el.classList.contains("inner-microbe")) toRelease.push(id);
          });
          toRelease.forEach(function (id) {
            var el = grabs.get(id);
            grabs.delete(id);
            if (el) el.classList.remove("dragging");
          });
          for (var i = 0; i < innerMicrobes.length; i++) {
            microbeMovement.delete(innerMicrobes[i]);
            innerMicrobes[i].remove();
          }
          innerMicrobes.length = 0;
        }

        var ethanolButton = document.getElementById("ethanol-button");
        ethanolButton.addEventListener("click", function () {
          emptyBubble();
        });

        function updateTrackVolumes() {
          if (!isPlaying) return;
          var trackCounts = [0, 0, 0, 0, 0, 0, 0];
          for (var i = 0; i < innerMicrobes.length; i++) {
            var ti =
              innerMicrobes[i].dataset.trackIndex != null
                ? parseInt(innerMicrobes[i].dataset.trackIndex, 10)
                : 0;
            if (ti >= 1 && ti <= 6) trackCounts[ti] += 1;
          }
          var MAX_VOLUME_UNITS = 20;
          for (var trackIndex = 1; trackIndex <= 6; trackIndex++) {
            var audio = audioPlayers[trackIndex];
            var count = trackCounts[trackIndex] || 0;
            audio.volume = Math.min(count / MAX_VOLUME_UNITS, 1.0);
          }
        }

        var lastSpawnSrc = null;
        var MAX_INNER = 150;

        setInterval(function () {
          var bounds = getCircleBounds();
          var inner = [];
          for (var i = 0; i < innerMicrobes.length; i++) {
            var img = innerMicrobes[i];
            if (img.classList.contains("dragging")) continue;
            var data = microbeMovement.get(img);
            if (!data) {
              initInnerMovement(img, 0, 0);
              data = microbeMovement.get(img);
            }
            var dist = Math.sqrt(data.x * data.x + data.y * data.y);
            if (dist < bounds.radius - 30) inner.push(img);
          }
          var total = innerMicrobes.length;
          if (inner.length === 0 || total >= MAX_INNER) return;
          var bySrc = {};
          inner.forEach(function (img) {
            var s = microbeSrc(img);
            if (!bySrc[s]) bySrc[s] = [];
            bySrc[s].push(img);
          });
          var srcs = Object.keys(bySrc).filter(function (s) {
            return s !== lastSpawnSrc;
          });
          if (srcs.length === 0) srcs = Object.keys(bySrc);
          var chosen = srcs[Math.floor(Math.random() * srcs.length)];
          var parent =
            bySrc[chosen][Math.floor(Math.random() * bySrc[chosen].length)];
          duplicateInnerMicrobe(parent);
          lastSpawnSrc = chosen;
        }, 2000);

        function addCornerMicrobe(container, src, fadeIn) {
          var wrap = createMicrobe("corner-microbe", src);
          wrap.addEventListener("mousedown", onMouseDown);
          wrap.addEventListener("touchstart", onTouchStart, {
            passive: false,
          });
          container.appendChild(wrap);
          cornerMicrobes.push(wrap);
          initCornerMovement(wrap, fadeIn);
          return wrap;
        }

        function populateCorners() {
          var corners = [
            document.getElementById("corner-tl"),
            document.getElementById("corner-tr"),
            document.getElementById("corner-bl"),
            document.getElementById("corner-br"),
            document.getElementById("corner-lm"),
            document.getElementById("corner-rm"),
          ];
          corners.forEach(function (container) {
            var type = container.getAttribute("data-type");
            var srcs = getCornerGifSrcs(type);
            srcs.forEach(function (src) {
              addCornerMicrobe(container, src);
            });
          });
        }

        function scheduleCornerDuplicates() {
          var extras = [];
          for (var c = 0; c < cornerMicrobes.length; c++) {
            var el = cornerMicrobes[c];
            var container = el.parentElement;
            var src = microbeSrc(el);
            extras.push({ container: container, src: src });
            extras.push({ container: container, src: src });
          }
          for (var i = extras.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = extras[i];
            extras[i] = extras[j];
            extras[j] = tmp;
          }
          var idx = 0;
          var timer = setInterval(function () {
            if (idx >= extras.length) {
              clearInterval(timer);
              return;
            }
            var item = extras[idx++];
            addCornerMicrobe(item.container, item.src, true);
          }, 450);
        }

        document.addEventListener("DOMContentLoaded", function () {
          populateCorners();
          document.addEventListener("mousemove", onMouseMove);
          document.addEventListener("mouseup", onPointerEnd);
          document.addEventListener("touchmove", onTouchMove, {
            passive: false,
          });
          document.addEventListener("touchend", onPointerEnd);
          animate();
        });

        setTimeout(function () {
          var loader = document.getElementById("loader");
          if (!loader || loader.classList.contains("fade-out")) return;
          loader.classList.add("fade-out");
          loader.addEventListener("transitionend", function () {
            loader.remove();
          });
          window._handsCameraRequested = true;
          if (typeof window.startHandsCamera === "function") {
            window.startHandsCamera();
          }
          scheduleCornerDuplicates();
          playAllTracks();
          setTimeout(function () {
            ethanolButton.classList.add("show");
          }, 10000);
        }, 2000);

        // Admin panel integration
        window.adminSettings = {};
        let lastSettingsHash = "";

        function applyAdminSettings(settings) {
          window.adminSettings = settings;
          lastSettingsHash = JSON.stringify(settings);

          if (settings.bubble) {
            const b = settings.bubble;
            circle.style.width = b.size + "px";
            circle.style.height = b.size + "px";
            circle.style.transform =
              "translate(" + b.x + "px, " + b.y + "px)";
            circle.style.opacity = b.opacity / 100;
            if (b.morph !== undefined) {
              const m = b.morph;
              const rb = () =>
                40 + m * 20 + Math.random() * (1 - m) * 20;
              circle.style.borderRadius =
                b.morph === 0
                  ? "50%"
                  : `${rb()}% ${rb()}% ${rb()}% ${rb()}% / ${rb()}% ${rb()}% ${rb()}% ${rb()}%`;
            }
            if (b.glow !== undefined) {
              const glow = b.glow;
              const intensity = 40 * glow;
              circle.style.boxShadow =
                `0 0 ${intensity}px rgba(160, 160, 160, ${0.3 * glow}),
                 inset 0 0 ${60 * glow}px rgba(255, 255, 255, ${0.1 * glow})`;
            }
          }

          if (settings.innerMicrobes) {
            const im = settings.innerMicrobes;
            innerMicrobes.forEach((el) => {
              el.style.width = im.size + "px";
              el.style.opacity = im.opacity / 100;
              if (im.speed !== undefined) {
                el.style.animationDuration =
                  (2 / im.speed) + "s";
              }
            });
          }

          if (settings.cornerMicrobes) {
            const cm = settings.cornerMicrobes;
            cornerMicrobes.forEach((el) => {
              el.style.width = cm.size + "px";
              el.style.opacity = cm.opacity / 100;
              if (!cm.draggable) {
                el.style.pointerEvents = "none";
              } else {
                el.style.pointerEvents = "auto";
              }
            });
          }

          if (settings.ethanol) {
            const e = settings.ethanol;
            const btn = document.getElementById("ethanol-button");
            if (e.visible) {
              btn.classList.add("show");
            } else {
              btn.classList.remove("show");
            }
            if (e.size !== undefined) {
              btn.style.transform =
                "translateX(-50%) scale(" + e.size + ")";
            }
            if (e.x !== undefined || e.y !== undefined) {
              btn.style.left =
                "calc(50% + " + (e.x || 0) + "px)";
              btn.style.top = (e.y || 10) + "px";
            }
            if (e.opacity !== undefined) {
              btn.style.opacity = e.opacity / 100;
            }
          }

          if (settings.global) {
            const g = settings.global;
            if (g.bgOpacity !== undefined) {
              const bg = document.querySelector("body::before");
              if (bg) {
                document.documentElement.style.setProperty(
                  "--bg-opacity",
                  g.bgOpacity / 100
                );
              }
            }
            if (g.webcam !== undefined) {
              const webcam = document.getElementById("webcam");
              if (webcam) {
                g.webcam
                  ? webcam.classList.add("active")
                  : webcam.classList.remove("active");
              }
              // Store selected device
              if (g.webcamDevice !== undefined) {
                window.selectedWebcamDevice = g.webcamDevice;
              }
            }
          }
        }

        window.addEventListener("message", function (event) {
          if (event.data.type === "admin-settings") {
            applyAdminSettings(event.data.data);
          } else if (event.data.type === "trigger-ethanol") {
            ethanolButton.click();
          }
        });

        // Load settings from localStorage on startup
        try {
          const stored = localStorage.getItem(
            "in-silico-admin-settings"
          );
          if (stored) {
            const settings = JSON.parse(stored);
            applyAdminSettings(settings);
          }
        } catch (e) {
          console.error("Failed to load admin settings:", e);
        }

        // Poll localStorage for changes (real-time sync from separate admin tabs)
        setInterval(function () {
          try {
            const stored = localStorage.getItem(
              "in-silico-admin-settings"
            );
            if (stored) {
              const hash = stored;
              if (hash !== lastSettingsHash) {
                const settings = JSON.parse(stored);
                applyAdminSettings(settings);
              }
            }
          } catch (e) {
            // Silently ignore parse errors
          }
        }, 250);
      })();
    </script>
    <script type="module" src="js/hands-input.js"></script>
  </body>
