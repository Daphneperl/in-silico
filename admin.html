<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - In-silico Synth</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a1a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: auto;
    }

    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 2px solid #333;
      padding-bottom: 20px;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    button {
      padding: 10px 20px;
      background: #0066cc;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }

    button:hover {
      background: #0052a3;
    }

    button.secondary {
      background: #444;
    }

    button.secondary:hover {
      background: #555;
    }

    button.danger {
      background: #cc3333;
    }

    button.danger:hover {
      background: #aa2222;
    }

    .panels {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 20px;
    }

    .panel {
      background: #2a2a2a;
      border: 1px solid #404040;
      border-radius: 8px;
      padding: 20px;
    }

    .panel h2 {
      font-size: 18px;
      margin-bottom: 15px;
      color: #66ccff;
      border-bottom: 1px solid #404040;
      padding-bottom: 10px;
    }

    .control-group {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 13px;
      font-weight: 500;
      color: #bbb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    label .value {
      color: #66ccff;
      font-weight: 600;
      font-family: monospace;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #404040;
      outline: none;
      -webkit-appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #66ccff;
      cursor: pointer;
      transition: background 0.2s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      background: #99ddff;
    }

    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #66ccff;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }

    input[type="range"]::-moz-range-thumb:hover {
      background: #99ddff;
    }

    input[type="number"],
    input[type="text"],
    select {
      background: #1a1a1a;
      border: 1px solid #404040;
      color: #fff;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 14px;
      font-family: monospace;
    }

    input[type="number"]:focus,
    input[type="text"]:focus,
    select:focus {
      outline: none;
      border-color: #66ccff;
      box-shadow: 0 0 8px rgba(102, 204, 255, 0.3);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #66ccff;
    }

    .divider {
      height: 1px;
      background: #404040;
      margin: 20px 0;
    }

    .preset-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .preset-buttons button {
      padding: 8px 12px;
      font-size: 12px;
    }

    .status {
      background: #1a3a3a;
      border-left: 3px solid #66ccff;
      padding: 12px;
      border-radius: 4px;
      font-size: 13px;
      margin-top: 10px;
    }

    .status.success {
      background: #1a3a1a;
      border-left-color: #66cc66;
      color: #99ff99;
    }

    .status.error {
      background: #3a1a1a;
      border-left-color: #cc6666;
      color: #ff9999;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .color-picker-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input[type="color"] {
      width: 50px;
      height: 40px;
      border: 1px solid #404040;
      border-radius: 4px;
      cursor: pointer;
    }

    .info-text {
      font-size: 12px;
      color: #999;
      font-style: italic;
      margin-top: 5px;
    }

    @media (max-width: 768px) {
      .panels {
        grid-template-columns: 1fr;
      }

      .header {
        flex-direction: column;
        gap: 15px;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="header">
      <div>
        <h1>🧬 Admin Panel</h1>
        <p style="color: #999; font-size: 13px; margin-top: 5px;">
          Real-time visualization controls
        </p>
      </div>
      <div class="header-actions">
        <button onclick="syncSettings()">↻ Sync</button>
        <button class="secondary" onclick="exportSettings()">⬇ Export</button>
        <button class="secondary" onclick="importSettings()">⬆ Import</button>
        <button class="danger" onclick="resetToDefaults()">Reset</button>
      </div>
    </div>

    <div class="panels">
      <!-- Bubble Controls -->
      <div class="panel">
        <h2>🫧 Bubble</h2>

        <div class="control-group">
          <label>Size (px) <span class="value" id="val-bubble-size">800</span></label>
          <input
            type="range"
            id="bubble-size"
            min="400"
            max="1200"
            value="800"
            step="10"
            oninput="updateBubble()"
          />
        </div>

        <div class="control-group">
          <label>X Position (px) <span class="value" id="val-bubble-x">0</span></label>
          <input
            type="range"
            id="bubble-x"
            min="-300"
            max="300"
            value="0"
            step="10"
            oninput="updateBubble()"
          />
        </div>

        <div class="control-group">
          <label>Y Position (px) <span class="value" id="val-bubble-y">0</span></label>
          <input
            type="range"
            id="bubble-y"
            min="-300"
            max="300"
            value="0"
            step="10"
            oninput="updateBubble()"
          />
        </div>

        <div class="control-group">
          <label>Morphing <span class="value" id="val-morph">0.5</span></label>
          <input
            type="range"
            id="bubble-morph"
            min="0"
            max="1"
            value="0.5"
            step="0.05"
            oninput="updateBubble()"
          />
          <div class="info-text">Higher = more irregular shape</div>
        </div>

        <div class="control-group">
          <label>Opacity <span class="value" id="val-bubble-opacity">100%</span></label>
          <input
            type="range"
            id="bubble-opacity"
            min="0"
            max="100"
            value="100"
            step="5"
            oninput="updateBubble()"
          />
        </div>

        <div class="control-group">
          <label>Glow Intensity <span class="value" id="val-glow">1</span></label>
          <input
            type="range"
            id="bubble-glow"
            min="0"
            max="2"
            value="1"
            step="0.1"
            oninput="updateBubble()"
          />
        </div>

        <div class="divider"></div>

        <div class="preset-buttons">
          <button class="secondary" onclick="presetBubble('small')">Small</button>
          <button class="secondary" onclick="presetBubble('medium')">Medium</button>
          <button class="secondary" onclick="presetBubble('large')">Large</button>
          <button class="secondary" onclick="presetBubble('center')">Center</button>
        </div>
      </div>

      <!-- Inner Microbes -->
      <div class="panel">
        <h2>🦠 Inner Microbes</h2>

        <div class="control-group">
          <label>Current Count <span class="value" id="val-inner-count">12</span></label>
          <input
            type="range"
            id="inner-count"
            min="0"
            max="100"
            value="12"
            step="1"
            oninput="updateMicrobes()"
          />
        </div>

        <div class="control-group">
          <label>Max Count <span class="value" id="val-inner-max">50</span></label>
          <input
            type="range"
            id="inner-max"
            min="10"
            max="200"
            value="50"
            step="10"
            oninput="updateMicrobes()"
          />
        </div>

        <div class="control-group">
          <label>Size (px) <span class="value" id="val-inner-size">104</span></label>
          <input
            type="range"
            id="inner-size"
            min="40"
            max="200"
            value="104"
            step="4"
            oninput="updateMicrobes()"
          />
        </div>

        <div class="control-group">
          <label>Animation Speed <span class="value" id="val-inner-speed">1</span>x</label>
          <input
            type="range"
            id="inner-speed"
            min="0.2"
            max="3"
            value="1"
            step="0.1"
            oninput="updateMicrobes()"
          />
        </div>

        <div class="control-group">
          <label>Spawn Rate <span class="value" id="val-spawn-rate">1</span>x</label>
          <input
            type="range"
            id="spawn-rate"
            min="0.1"
            max="5"
            value="1"
            step="0.1"
            oninput="updateMicrobes()"
          />
        </div>

        <div class="control-group">
          <label>Opacity <span class="value" id="val-inner-opacity">100%</span></label>
          <input
            type="range"
            id="inner-opacity"
            min="0"
            max="100"
            value="100"
            step="5"
            oninput="updateMicrobes()"
          />
        </div>

        <div class="divider"></div>

        <div class="control-group">
          <label class="checkbox-group">
            <input type="checkbox" id="auto-spawn" onchange="updateMicrobes()" checked />
            <span>Auto-spawn when below max</span>
          </label>
        </div>
      </div>

      <!-- Corner Microbes -->
      <div class="panel">
        <h2>🧫 Corner Microbes</h2>

        <div class="control-group">
          <label>Count per Corner <span class="value" id="val-corner-count">1</span></label>
          <input
            type="range"
            id="corner-count"
            min="0"
            max="5"
            value="1"
            step="1"
            oninput="updateCornerMicrobes()"
          />
        </div>

        <div class="control-group">
          <label>Max Total <span class="value" id="val-corner-max">12</span></label>
          <input
            type="range"
            id="corner-max"
            min="6"
            max="36"
            value="12"
            step="1"
            oninput="updateCornerMicrobes()"
          />
        </div>

        <div class="control-group">
          <label>Size (px) <span class="value" id="val-corner-size">120</span></label>
          <input
            type="range"
            id="corner-size"
            min="60"
            max="240"
            value="120"
            step="10"
            oninput="updateCornerMicrobes()"
          />
        </div>

        <div class="control-group">
          <label>Drag Resistance <span class="value" id="val-drag-resistance">1</span></label>
          <input
            type="range"
            id="drag-resistance"
            min="0.1"
            max="3"
            value="1"
            step="0.1"
            oninput="updateCornerMicrobes()"
          />
          <div class="info-text">Higher = slower drag movement</div>
        </div>

        <div class="control-group">
          <label>Opacity <span class="value" id="val-corner-opacity">100%</span></label>
          <input
            type="range"
            id="corner-opacity"
            min="0"
            max="100"
            value="100"
            step="5"
            oninput="updateCornerMicrobes()"
          />
        </div>

        <div class="divider"></div>

        <div class="control-group">
          <label class="checkbox-group">
            <input type="checkbox" id="draggable-toggle" onchange="updateCornerMicrobes()" checked />
            <span>Draggable</span>
          </label>
        </div>
      </div>

      <!-- Ethanol Bottle -->
      <div class="panel">
        <h2>🍶 Ethanol Bottle</h2>

        <div class="control-group">
          <label class="checkbox-group">
            <input type="checkbox" id="ethanol-visible" onchange="updateEthanol()" checked />
            <span>Visible</span>
          </label>
        </div>

        <div class="control-group">
          <label>Size (scale) <span class="value" id="val-ethanol-size">1</span>x</label>
          <input
            type="range"
            id="ethanol-size"
            min="0.5"
            max="2"
            value="1"
            step="0.1"
            oninput="updateEthanol()"
          />
        </div>

        <div class="control-group">
          <label>X Position (px) <span class="value" id="val-ethanol-x">0</span></label>
          <input
            type="range"
            id="ethanol-x"
            min="-200"
            max="200"
            value="0"
            step="10"
            oninput="updateEthanol()"
          />
        </div>

        <div class="control-group">
          <label>Y Position (px) <span class="value" id="val-ethanol-y">10</span></label>
          <input
            type="range"
            id="ethanol-y"
            min="-100"
            max="200"
            value="10"
            step="10"
            oninput="updateEthanol()"
          />
        </div>

        <div class="control-group">
          <label>Opacity <span class="value" id="val-ethanol-opacity">100%</span></label>
          <input
            type="range"
            id="ethanol-opacity"
            min="0"
            max="100"
            value="100"
            step="5"
            oninput="updateEthanol()"
          />
        </div>

        <div class="divider"></div>

        <button onclick="triggerEthanol()">🔄 Trigger Reset</button>
      </div>

      <!-- Global Settings -->
      <div class="panel">
        <h2>⚙️ Global Settings</h2>

        <div class="control-group">
          <label>Speed Multiplier <span class="value" id="val-global-speed">1</span>x</label>
          <input
            type="range"
            id="global-speed"
            min="0.1"
            max="3"
            value="1"
            step="0.1"
            oninput="updateGlobal()"
          />
        </div>

        <div class="control-group">
          <label>Background Opacity <span class="value" id="val-bg-opacity">70%</span></label>
          <input
            type="range"
            id="bg-opacity"
            min="0"
            max="100"
            value="70"
            step="5"
            oninput="updateGlobal()"
          />
        </div>

        <div class="divider"></div>

        <div class="control-group">
          <label class="checkbox-group">
            <input type="checkbox" id="webcam-toggle" onchange="updateGlobal()" />
            <span>Webcam Input</span>
          </label>
        </div>

        <div class="control-group">
          <label class="checkbox-group">
            <input type="checkbox" id="hand-gesture-toggle" onchange="updateGlobal()" checked />
            <span>Hand Gesture Detection</span>
          </label>
        </div>

        <div class="control-group">
          <label class="checkbox-group">
            <input type="checkbox" id="sound-toggle" onchange="updateGlobal()" checked />
            <span>Sound Effects</span>
          </label>
        </div>

        <div class="divider"></div>

        <div class="control-group">
          <label>Hand Sensitivity <span class="value" id="val-hand-sens">1</span>x</label>
          <input
            type="range"
            id="hand-sensitivity"
            min="0.1"
            max="2"
            value="1"
            step="0.1"
            oninput="updateGlobal()"
          />
        </div>
      </div>

      <!-- Debug Info -->
      <div class="panel">
        <h2>🐛 Debug & Info</h2>

        <div id="debug-info" style="font-size: 12px; font-family: monospace; line-height: 1.6;">
          <div>Status: <span style="color: #66cc66;">Connected</span></div>
          <div>Last sync: <span id="last-sync">Now</span></div>
          <div>Version: 1.0.0</div>
        </div>

        <div class="divider"></div>

        <button class="secondary" onclick="openMainWindow()">👁 Open Main</button>
        <button class="secondary" onclick="reloadMain()" style="margin-top: 8px;">🔄 Reload Main</button>

        <div class="divider"></div>

        <div class="status success" id="status-message" style="display: none;"></div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "in-silico-admin-settings";
    const SYNC_INTERVAL = 500; // ms

    // Initialize
    document.addEventListener("DOMContentLoaded", () => {
      loadSettings();
      setInterval(syncSettings, SYNC_INTERVAL);
    });

    function saveSettings() {
      const settings = {
        bubble: {
          size: parseInt(document.getElementById("bubble-size").value),
          x: parseInt(document.getElementById("bubble-x").value),
          y: parseInt(document.getElementById("bubble-y").value),
          morph: parseFloat(document.getElementById("bubble-morph").value),
          opacity: parseInt(document.getElementById("bubble-opacity").value),
          glow: parseFloat(document.getElementById("bubble-glow").value),
        },
        innerMicrobes: {
          count: parseInt(document.getElementById("inner-count").value),
          max: parseInt(document.getElementById("inner-max").value),
          size: parseInt(document.getElementById("inner-size").value),
          speed: parseFloat(document.getElementById("inner-speed").value),
          spawnRate: parseFloat(document.getElementById("spawn-rate").value),
          opacity: parseInt(document.getElementById("inner-opacity").value),
          autoSpawn: document.getElementById("auto-spawn").checked,
        },
        cornerMicrobes: {
          count: parseInt(document.getElementById("corner-count").value),
          max: parseInt(document.getElementById("corner-max").value),
          size: parseInt(document.getElementById("corner-size").value),
          dragResistance: parseFloat(document.getElementById("drag-resistance").value),
          opacity: parseInt(document.getElementById("corner-opacity").value),
          draggable: document.getElementById("draggable-toggle").checked,
        },
        ethanol: {
          visible: document.getElementById("ethanol-visible").checked,
          size: parseFloat(document.getElementById("ethanol-size").value),
          x: parseInt(document.getElementById("ethanol-x").value),
          y: parseInt(document.getElementById("ethanol-y").value),
          opacity: parseInt(document.getElementById("ethanol-opacity").value),
        },
        global: {
          speedMultiplier: parseFloat(document.getElementById("global-speed").value),
          bgOpacity: parseInt(document.getElementById("bg-opacity").value),
          webcam: document.getElementById("webcam-toggle").checked,
          handGestures: document.getElementById("hand-gesture-toggle").checked,
          sound: document.getElementById("sound-toggle").checked,
          handSensitivity: parseFloat(document.getElementById("hand-sensitivity").value),
        },
      };

      localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
      broadcastToMain(settings);
      updateLastSync();
    }

    function loadSettings() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (!stored) return;

      const settings = JSON.parse(stored);

      // Bubble
      if (settings.bubble) {
        document.getElementById("bubble-size").value = settings.bubble.size;
        document.getElementById("bubble-x").value = settings.bubble.x;
        document.getElementById("bubble-y").value = settings.bubble.y;
        document.getElementById("bubble-morph").value = settings.bubble.morph;
        document.getElementById("bubble-opacity").value = settings.bubble.opacity;
        document.getElementById("bubble-glow").value = settings.bubble.glow;
      }

      // Inner microbes
      if (settings.innerMicrobes) {
        document.getElementById("inner-count").value = settings.innerMicrobes.count;
        document.getElementById("inner-max").value = settings.innerMicrobes.max;
        document.getElementById("inner-size").value = settings.innerMicrobes.size;
        document.getElementById("inner-speed").value = settings.innerMicrobes.speed;
        document.getElementById("spawn-rate").value = settings.innerMicrobes.spawnRate;
        document.getElementById("inner-opacity").value = settings.innerMicrobes.opacity;
        document.getElementById("auto-spawn").checked = settings.innerMicrobes.autoSpawn;
      }

      // Corner microbes
      if (settings.cornerMicrobes) {
        document.getElementById("corner-count").value = settings.cornerMicrobes.count;
        document.getElementById("corner-max").value = settings.cornerMicrobes.max;
        document.getElementById("corner-size").value = settings.cornerMicrobes.size;
        document.getElementById("drag-resistance").value = settings.cornerMicrobes.dragResistance;
        document.getElementById("corner-opacity").value = settings.cornerMicrobes.opacity;
        document.getElementById("draggable-toggle").checked = settings.cornerMicrobes.draggable;
      }

      // Ethanol
      if (settings.ethanol) {
        document.getElementById("ethanol-visible").checked = settings.ethanol.visible;
        document.getElementById("ethanol-size").value = settings.ethanol.size;
        document.getElementById("ethanol-x").value = settings.ethanol.x;
        document.getElementById("ethanol-y").value = settings.ethanol.y;
        document.getElementById("ethanol-opacity").value = settings.ethanol.opacity;
      }

      // Global
      if (settings.global) {
        document.getElementById("global-speed").value = settings.global.speedMultiplier;
        document.getElementById("bg-opacity").value = settings.global.bgOpacity;
        document.getElementById("webcam-toggle").checked = settings.global.webcam;
        document.getElementById("hand-gesture-toggle").checked = settings.global.handGestures;
        document.getElementById("sound-toggle").checked = settings.global.sound;
        document.getElementById("hand-sensitivity").value = settings.global.handSensitivity;
      }

      updateAllDisplays();
    }

    function updateAllDisplays() {
      document.getElementById("val-bubble-size").textContent = document.getElementById("bubble-size").value;
      document.getElementById("val-bubble-x").textContent = document.getElementById("bubble-x").value;
      document.getElementById("val-bubble-y").textContent = document.getElementById("bubble-y").value;
      document.getElementById("val-morph").textContent = document.getElementById("bubble-morph").value;
      document.getElementById("val-bubble-opacity").textContent = document.getElementById("bubble-opacity").value + "%";
      document.getElementById("val-glow").textContent = document.getElementById("bubble-glow").value;

      document.getElementById("val-inner-count").textContent = document.getElementById("inner-count").value;
      document.getElementById("val-inner-max").textContent = document.getElementById("inner-max").value;
      document.getElementById("val-inner-size").textContent = document.getElementById("inner-size").value;
      document.getElementById("val-inner-speed").textContent = document.getElementById("inner-speed").value;
      document.getElementById("val-spawn-rate").textContent = document.getElementById("spawn-rate").value;
      document.getElementById("val-inner-opacity").textContent = document.getElementById("inner-opacity").value + "%";

      document.getElementById("val-corner-count").textContent = document.getElementById("corner-count").value;
      document.getElementById("val-corner-max").textContent = document.getElementById("corner-max").value;
      document.getElementById("val-corner-size").textContent = document.getElementById("corner-size").value;
      document.getElementById("val-drag-resistance").textContent = document.getElementById("drag-resistance").value;
      document.getElementById("val-corner-opacity").textContent = document.getElementById("corner-opacity").value + "%";

      document.getElementById("val-ethanol-size").textContent = document.getElementById("ethanol-size").value;
      document.getElementById("val-ethanol-x").textContent = document.getElementById("ethanol-x").value;
      document.getElementById("val-ethanol-y").textContent = document.getElementById("ethanol-y").value;
      document.getElementById("val-ethanol-opacity").textContent = document.getElementById("ethanol-opacity").value + "%";

      document.getElementById("val-global-speed").textContent = document.getElementById("global-speed").value;
      document.getElementById("val-bg-opacity").textContent = document.getElementById("bg-opacity").value + "%";
      document.getElementById("val-hand-sens").textContent = document.getElementById("hand-sensitivity").value;
    }

    function updateBubble() {
      updateAllDisplays();
      saveSettings();
    }

    function updateMicrobes() {
      updateAllDisplays();
      saveSettings();
    }

    function updateCornerMicrobes() {
      updateAllDisplays();
      saveSettings();
    }

    function updateEthanol() {
      updateAllDisplays();
      saveSettings();
    }

    function updateGlobal() {
      updateAllDisplays();
      saveSettings();
    }

    function presetBubble(type) {
      const presets = {
        small: { size: 500, x: 0, y: 0 },
        medium: { size: 800, x: 0, y: 0 },
        large: { size: 1000, x: 0, y: 0 },
        center: { size: 800, x: 0, y: 0 },
      };
      const p = presets[type];
      if (p) {
        document.getElementById("bubble-size").value = p.size;
        document.getElementById("bubble-x").value = p.x;
        document.getElementById("bubble-y").value = p.y;
        updateBubble();
      }
    }

    function resetToDefaults() {
      if (confirm("Reset all settings to defaults?")) {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
      }
    }

    function syncSettings() {
      loadSettings();
    }

    function broadcastToMain(settings) {
      const mainWindow = window.opener;
      if (mainWindow) {
        mainWindow.postMessage(
          { type: "admin-settings", data: settings },
          "*"
        );
      }
    }

    function updateLastSync() {
      const now = new Date();
      document.getElementById("last-sync").textContent = now.toLocaleTimeString();
    }

    function triggerEthanol() {
      const mainWindow = window.opener;
      if (mainWindow) {
        mainWindow.postMessage({ type: "trigger-ethanol" }, "*");
      }
      showStatus("Ethanol triggered on main window", "success");
    }

    function openMainWindow() {
      window.open("./index.html", "main-window", "width=1200,height=800");
    }

    function reloadMain() {
      const mainWindow = window.opener;
      if (mainWindow) {
        mainWindow.location.reload();
      } else {
        showStatus("Main window not found", "error");
      }
    }

    function exportSettings() {
      const settings = localStorage.getItem(STORAGE_KEY);
      if (settings) {
        const blob = new Blob([settings], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "in-silico-settings.json";
        a.click();
        URL.revokeObjectURL(url);
        showStatus("Settings exported", "success");
      }
    }

    function importSettings() {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = ".json";
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (evt) => {
            try {
              const settings = JSON.parse(evt.target.result);
              localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
              location.reload();
              showStatus("Settings imported", "success");
            } catch {
              showStatus("Invalid JSON file", "error");
            }
          };
          reader.readAsText(file);
        }
      };
      input.click();
    }

    function showStatus(message, type = "success") {
      const el = document.getElementById("status-message");
      el.textContent = message;
      el.className = "status " + type;
      el.style.display = "block";
      setTimeout(() => (el.style.display = "none"), 3000);
    }
  </script>
</body>
</html>
